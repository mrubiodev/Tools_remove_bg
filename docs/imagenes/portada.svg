<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tools_remove_bg — elimina el fondo de tus imágenes</title>
  <desc id="desc">Comparación de una imagen con fondo y el mismo sujeto recortado sobre transparencia, junto a las opciones de uso gráfico y por terminal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#182541"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42d6c5"/>
      <stop offset="1" stop-color="#72a7ff"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc977"/>
      <stop offset="1" stop-color="#ff8c78"/>
    </linearGradient>
    <pattern id="check" width="36" height="36" patternUnits="userSpaceOnUse">
      <rect width="36" height="36" fill="#edf2f7"/>
      <rect width="18" height="18" fill="#cbd5e1"/>
      <rect x="18" y="18" width="18" height="18" fill="#cbd5e1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity=".34"/>
    </filter>
    <clipPath id="photoClip"><rect x="820" y="176" width="300" height="440" rx="24"/></clipPath>
    <clipPath id="cutClip"><rect x="1142" y="176" width="300" height="440" rx="24"/></clipPath>
    <g id="subject">
      <path d="M112 218c9-56 54-91 108-91s99 35 108 91l25 145H87z" fill="#263c59"/>
      <path d="M112 218c9-56 54-91 108-91s99 35 108 91l25 145H87z" fill="none" stroke="#dce9ff" stroke-opacity=".38" stroke-width="4"/>
      <path d="M170 134c-17-17-20-43-14-65 10-37 43-61 74-61 38 0 69 29 73 66 4 40-15 72-37 87z" fill="url(#person)"/>
      <path d="M159 78c3-44 34-70 72-70 37 0 69 27 73 68-18-9-37-18-57-20-27-2-54 7-88 22z" fill="#25334b"/>
      <path d="M187 98c9 7 18 10 28 10m36 0c9 0 17-3 24-9" fill="none" stroke="#7c3f43" stroke-width="4" stroke-linecap="round"/>
      <path d="M224 116c9 7 20 7 29 0" fill="none" stroke="#a54f54" stroke-width="4" stroke-linecap="round"/>
      <path d="M218 136l-2 27 26 1-5-29" fill="#f29c83"/>
      <path d="M202 192l21 27 24-27 20 171H177z" fill="#f1f5f9"/>
      <path d="M222 219l-30 31 30 22 31-22z" fill="url(#accent)"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="130" cy="790" r="350" fill="#42d6c5" opacity=".055"/>
  <circle cx="1510" cy="60" r="330" fill="#72a7ff" opacity=".07"/>
  <path d="M0 690c290-110 475-95 700 0s490 125 900-20v230H0z" fill="#0a1223" opacity=".42"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="116" y="132" width="62" height="8" rx="4" fill="url(#accent)"/>
    <text x="116" y="226" fill="#f8fafc" font-size="68" font-weight="750" letter-spacing="-2">Tools_remove_bg</text>
    <text x="120" y="286" fill="#c6d3e6" font-size="28">Quita fondos. Conserva lo que importa.</text>
    <text x="120" y="340" fill="#8fa4c1" font-size="19">Procesa una imagen o una carpeta y guarda el resultado en PNG.</text>

    <g transform="translate(120 410)">
      <rect width="204" height="54" rx="27" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="28" cy="27" r="7" fill="#42d6c5"/>
      <text x="48" y="35" fill="#e5eefc" font-size="18" font-weight="600">Interfaz gráfica</text>
      <rect x="220" width="166" height="54" rx="27" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
      <circle cx="248" cy="27" r="7" fill="#72a7ff"/>
      <text x="268" y="35" fill="#e5eefc" font-size="18" font-weight="600">Línea de comandos</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="796" y="151" width="670" height="535" rx="34" fill="#f8fafc" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".15"/>
      <g clip-path="url(#photoClip)">
        <rect x="820" y="176" width="300" height="440" fill="#c6d7e8"/>
        <rect x="820" y="176" width="300" height="440" fill="#f5b882" opacity=".55"/>
        <circle cx="1040" cy="250" r="94" fill="#ffe2a8" opacity=".66"/>
        <path d="M820 454c70-100 145-88 202-10 36 49 65 56 98 23v149H820z" fill="#7b9a89"/>
        <path d="M820 515c80-55 151-21 208 17 31 21 61 17 92-10v94H820z" fill="#627e78"/>
        <use href="#subject" x="812" y="237"/>
      </g>
      <g clip-path="url(#cutClip)">
        <rect x="1142" y="176" width="300" height="440" fill="url(#check)"/>
        <use href="#subject" x="1134" y="237"/>
      </g>
      <rect x="820" y="176" width="300" height="440" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
      <rect x="1142" y="176" width="300" height="440" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
      <rect x="837" y="193" width="112" height="34" rx="17" fill="#101a2c" fill-opacity=".78"/>
      <text x="893" y="216" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing=".7">ORIGINAL</text>
      <rect x="1159" y="193" width="142" height="34" rx="17" fill="#101a2c" fill-opacity=".78"/>
      <text x="1230" y="216" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700" letter-spacing=".7">FONDO QUITADO</text>
      <path d="M1127 384h9m-4-5 5 5-5 5" fill="none" stroke="#42d6c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="820" y="657" fill="#b8c7dc" font-size="16">Transparencia PNG · modelos rembg</text>
    </g>
    <text x="120" y="798" fill="#8296b2" font-size="16">mrubiodev · herramientas de imagen</text>
    <text x="1480" y="798" text-anchor="end" fill="#8296b2" font-size="16">Python · rembg · Pillow</text>
  </g>
</svg>