<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111827"/>
    <stop offset="0.55" stop-color="#1e293b"/>
    <stop offset="1" stop-color="#0f172a"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="checker" width="72" height="72" patternUnits="userSpaceOnUse">
    <rect width="72" height="72" fill="#e5e7eb"/>
    <rect width="36" height="36" fill="#cbd5e1"/>
    <rect x="36" y="36" width="36" height="36" fill="#cbd5e1"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="20" stdDeviation="22" flood-opacity=".35"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1380" cy="130" r="260" fill="#38bdf8" opacity=".07"/>
<circle cx="180" cy="780" r="330" fill="#a78bfa" opacity=".06"/>

<!-- checkerboard transparency panel -->
<g filter="url(#shadow)">
  <rect x="900" y="165" width="520" height="520" rx="34" fill="url(#checker)"/>
  <!-- abstract foreground object -->
  <path d="M1030 575 C980 505 1005 420 1075 385 C1120 363 1160 328 1190 270
           C1212 228 1270 210 1310 239 C1354 270 1348 330 1322 371
           C1295 413 1292 455 1320 500 C1350 548 1324 602 1275 620
           C1210 646 1085 642 1030 575Z"
        fill="url(#accent)" opacity=".96"/>
  <path d="M1110 555 C1080 500 1098 452 1140 420 C1172 396 1190 355 1205 320
           C1217 292 1250 280 1272 300 C1297 323 1284 360 1266 386
           C1244 418 1242 465 1265 505 C1280 532 1262 559 1230 568
           C1185 581 1132 580 1110 555Z" fill="#0f172a" opacity=".72"/>
  <!-- removed background cut line -->
  <path d="M945 735 H1375" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <circle cx="945" cy="735" r="8" fill="#38bdf8"/>
  <circle cx="1375" cy="735" r="8" fill="#a78bfa"/>
</g>

<!-- title -->
<text x="130" y="255" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700">TOOLS_REMOVE_BG</text>
<text x="136" y="335" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="38">Background removal utility</text>
<rect x="136" y="390" width="230" height="8" rx="4" fill="url(#accent)"/>
<text x="136" y="480" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="30">REMOVE</text>
<text x="136" y="525" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">BACKGROUND</text>
<text x="136" y="600" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="24">mrubiodev · image tools</text>

<!-- transparent pixels motif -->
<g opacity=".35">
  <rect x="136" y="665" width="22" height="22" fill="#e5e7eb"/>
  <rect x="158" y="665" width="22" height="22" fill="#94a3b8"/>
  <rect x="180" y="665" width="22" height="22" fill="#e5e7eb"/>
  <rect x="158" y="687" width="22" height="22" fill="#e5e7eb"/>
  <rect x="180" y="687" width="22" height="22" fill="#94a3b8"/>
  <rect x="202" y="687" width="22" height="22" fill="#e5e7eb"/>
</g>
</svg>